services:
  postgres:
    image: postgres:18.7-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_DB_HOST=${DB_HOST}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_SSL_MODE=${SSL_MODE}
      - POSTGRES_DB_PORT=${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  redis:
    image: redis:8.8-alpine
    container_name: redis_db
    volumes:
      - redis:/data
    ports:
      - 6379:6379
  
  app:
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: go.mod
        - action: rebuild
          path: go.sum
    build: 
      context: .
      dockerfile: deployments/docker/Dockerfile
    container_name: moneyflow_api
    ports:
      - "5000:5000"


volumes:
  postgres_data:
  redis: